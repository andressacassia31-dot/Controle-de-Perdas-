<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - La Serenísima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-12">

    <!-- Cabeçalho com Navegação -->
    <header class="bg-blue-800 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold">La Serenísima | Gestão de Perdas</h1>
                <span class="text-sm bg-blue-700 px-2 py-1 rounded">Bragança Paulista</span>
            </div>
            <!-- Menu Responsivo -->
            <nav class="flex space-x-2 bg-blue-900 p-1 rounded-lg overflow-x-auto">
                <a href="index.html" class="px-3 py-2 rounded hover:bg-blue-700 transition text-sm font-medium whitespace-nowrap">📝 Lançar</a>
                <a href="historico.html" class="px-3 py-2 rounded bg-blue-600 text-white shadow text-sm font-medium whitespace-nowrap">⏳ Histórico</a>
                <a href="dashboard.html" class="px-3 py-2 rounded hover:bg-blue-700 transition text-sm font-medium whitespace-nowrap">📊 Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto mt-6 p-4 space-y-6">
        
        <div class="flex justify-between items-center border-b pb-2">
            <h2 class="text-xl font-semibold text-blue-800">Últimos Lançamentos</h2>
            <button onclick="carregarHistorico()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-gray-700 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Atualizar
            </button>
        </div>

        <!-- Container de Cards -->
        <div id="lista_historico" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-500 text-sm">Carregando histórico...</p>
        </div>

    </main>

    <script>
        // 1. CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://cgnniidbahkfuvhqyzvu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnbm5paWRiYWhrZnV2aHF5enZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MTk4MjMsImV4cCI6MjEwMzA5NTgyM30.Fi9VFiHR97cSnRh-_5Orl-EPva6shd1W8wHhciMB44o';
        const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const containerHistorico = document.getElementById('lista_historico');

        // 2. BUSCAR DADOS
        async function carregarHistorico() {
            containerHistorico.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-4">Buscando dados...</p>';

            try {
                const { data: registros, error } = await clienteSupabase
                    .from('registros_producao')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                renderizarRegistros(registros);

            } catch (err) {
                console.error(err);
                containerHistorico.innerHTML = '<p class="text-red-500 text-sm col-span-full text-center py-4">Erro ao carregar histórico. Verifique o console.</p>';
            }
        }

        // 3. RENDERIZAR NA TELA
        function renderizarRegistros(registros) {
            if (!registros || registros.length === 0) {
                containerHistorico.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-4">Nenhum registro encontrado.</p>';
                return;
            }

            containerHistorico.innerHTML = '';

            registros.forEach(registro => {
                const dataObj = new Date(registro.created_at);
                const dataFormatada = dataObj.toLocaleDateString('pt-BR');
                const horaFormatada = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                // Lógica Dinâmica: Só monta o bloco de ocorrências se houver algum texto digitado
                let blocoOcorrenciasHtml = '';
                if (registro.problemas || registro.plano_acao || registro.resultado_alcancado) {
                    blocoOcorrenciasHtml = `
                        <div class="mt-3 mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md text-sm text-gray-800">
                            <h4 class="font-bold text-yellow-800 mb-2 uppercase text-[10px] tracking-wider">Ocorrências Registradas</h4>
                            ${registro.problemas ? `<p class="mb-1"><span class="font-semibold text-gray-700">Problemas:</span> ${registro.problemas}</p>` : ''}
                            ${registro.plano_acao ? `<p class="mb-1"><span class="font-semibold text-gray-700">Plano de Ação:</span> ${registro.plano_acao}</p>` : ''}
                            ${registro.resultado_alcancado ? `<p><span class="font-semibold text-gray-700">Resultado:</span> ${registro.resultado_alcancado}</p>` : ''}
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow border border-gray-200 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3 border-b pb-2">
                            <div>
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">Linha ${registro.linha_id}</span>
                                <span class="bg-gray-100 text-gray-800 text-xs font-bold px-2 py-1 rounded ml-1">${registro.turno}º Turno</span>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-500 font-medium">${dataFormatada}</p>
                                <p class="text-xs text-gray-400">${horaFormatada}</p>
                            </div>
                        </div>
                        
                        <div class="mb-3 space-y-1">
                            <p class="text-sm"><span class="font-semibold text-gray-700">Produto:</span> ${registro.produto_codigo}</p>
                            <p class="text-sm"><span class="font-semibold text-gray-700">Volume Aceito:</span> ${registro.volume_aceito} un</p>
                            <p class="text-sm"><span class="font-semibold text-gray-700">Média Balança:</span> ${registro.media_balanca}g</p>
                        </div>

                        <div class="flex space-x-2 mb-2">
                            <div class="flex-1 bg-red-50 p-2 rounded text-center border border-red-100">
                                <p class="text-[10px] uppercase font-bold text-red-600">Perda MP</p>
                                <p class="font-bold text-gray-800">${Number(registro.perda_leite_kg).toFixed(2)} kg</p>
                            </div>
                            <div class="flex-1 bg-orange-50 p-2 rounded text-center border border-orange-100">
                                <p class="text-[10px] uppercase font-bold text-orange-600">Perda Emb.</p>
                                <p class="font-bold text-gray-800">${Number(registro.perda_embalagem_kg).toFixed(2)} kg</p>
                            </div>
                        </div>

                        <!-- Injeção condicional do bloco de ocorrências -->
                        ${blocoOcorrenciasHtml}

                    </div>

                    <button onclick="deletarRegistro('${registro.id}')" class="mt-auto w-full flex items-center justify-center gap-2 bg-white hover:bg-red-50 text-red-600 border border-red-200 transition-colors py-2 rounded text-sm font-semibold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Apagar Lançamento
                    </button>
                `;

                containerHistorico.appendChild(card);
            });
        }

        // 4. DELETAR REGISTRO
        async function deletarRegistro(id) {
            const confirmacao = window.confirm("⚠️ ATENÇÃO: Tem certeza que deseja apagar este lançamento?\n\nEsta ação não pode ser desfeita.");
            if (!confirmacao) return;

            try {
                const { error } = await clienteSupabase
                    .from('registros_producao')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert("Lançamento apagado com sucesso!");
                carregarHistorico();

            } catch (err) {
                console.error(err);
                alert("Erro ao apagar. Verifique sua conexão ou as permissões do banco.");
            }
        }

        carregarHistorico();

    </script>
</body>
</html>
